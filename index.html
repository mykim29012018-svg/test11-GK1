<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiểm tra Chương 1: Dao động – Vật lí 11</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ecf1;--paper:#fff;--ink:#17222e;--muted:#5a6a7b;--line:#d3dae3;--accent:#1f5f8b;--onacc:#fff;--pick:#e4eef7;--ok:#17703f;--okbg:#e2f3e9;--bad:#b3261e;--badbg:#fbe6e4;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151d;--paper:#17212c;--ink:#e8eef5;--muted:#9aabbc;--line:#2b3947;--accent:#74b6e3;--onacc:#0a1520;--pick:#1a3347;--ok:#68d29a;--okbg:#12311f;--bad:#ff8f86;--badbg:#391816;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e151d;--paper:#17212c;--ink:#e8eef5;--muted:#9aabbc;--line:#2b3947;--accent:#74b6e3;--onacc:#0a1520;--pick:#1a3347;--ok:#68d29a;--okbg:#12311f;--bad:#ff8f86;--badbg:#391816;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 14px 56px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px 22px;margin-bottom:16px}
h1,h2,.qh{font-family:"Source Serif 4",Georgia,serif}
h1{font-size:1.65rem;line-height:1.2;margin:0 0 4px}
h2{font-size:1.2rem;margin:0 0 2px}
.sub{color:var(--muted);margin:0}
.hint{color:var(--muted);font-style:italic;margin:2px 0 6px;font-size:.93rem}
label.f{display:block;font-weight:600;margin-top:16px}
input[type=text]{font:inherit;width:100%;padding:10px 12px;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
input[type=text]:focus-visible,button:focus-visible,.opt:has(input:focus-visible),.pill:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;padding:11px 20px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--onacc);cursor:pointer;margin-top:20px}
button.alt{background:transparent;color:var(--accent)}
.err{color:var(--bad);margin:8px 0 0;min-height:1.4em}
.who{display:flex;flex-wrap:wrap;gap:4px 24px;margin:10px 0 0;color:var(--muted)}
.who b{color:var(--ink)}
.q{padding:18px 0 4px}
[hidden]{display:none!important}
.qh{font-size:1.06rem;margin:0 0 4px}
.qn{font-weight:700;color:var(--accent);font-family:"Be Vietnam Pro",sans-serif}
.opt{display:flex;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-top:8px;cursor:pointer}
.opt:has(input:checked){background:var(--pick);border-color:var(--accent)}
.opt .l{font-weight:700;min-width:1.3em}
.opt .t{flex:1}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.tag{font-size:.82rem;font-weight:600;white-space:nowrap}
.ok .tag{color:var(--ok)}.bad .tag{color:var(--bad)}
.locked .opt,.locked .pill{cursor:default}
figure{margin:10px 0 6px}
figure img{display:block;max-width:100%;height:auto;background:#fff;border-radius:6px;padding:6px;border:1px solid var(--line)}
.st{padding:10px 0;border-top:1px dashed var(--line)}
.st .row{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.st .l{font-weight:700;margin-right:4px}
.tf{display:flex;gap:6px;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:.93rem}
.pill:has(input:checked){background:var(--pick);border-color:var(--accent);font-weight:600}
.pill.ok{background:var(--okbg);border-color:var(--ok)}
.pill.bad{background:var(--badbg);border-color:var(--bad)}
.pill input,.opt input{accent-color:var(--accent);margin:3px 0 0}
.ans{display:flex;align-items:center;gap:10px;margin-top:8px}
.ans input{max-width:170px;margin:0}
.unit{color:var(--muted)}
.why{margin:8px 0 6px;padding:8px 12px;border-left:3px solid var(--line);font-size:.93rem;color:var(--muted)}
.why.ok{border-color:var(--ok)}.why.bad{border-color:var(--bad)}
.why b{color:var(--ink)}
.qs{margin:6px 0 10px;font-weight:600;font-size:.93rem}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.bar p{margin:20px 0 0;color:var(--muted)}
#pal{display:grid;gap:8px}
.pg{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pl{min-width:4.8rem;font-weight:600;font-size:.9rem;color:var(--muted)}
.pb{display:flex;flex-wrap:wrap;gap:6px}
.pn{margin:0;padding:0;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:600;font-size:.9rem}
.pn.done{background:var(--pick);border-color:var(--accent)}
.pn.part,.pn.mid{background:var(--pick);border:1px dashed var(--accent)}
.pn.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.pn.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.pn.cur{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.score{display:flex;align-items:baseline;gap:8px;margin:10px 0 4px}
.score .n{font-family:"Source Serif 4",Georgia,serif;font-size:3.6rem;font-weight:600;line-height:1;color:var(--accent)}
.score .d{font-size:1.3rem;color:var(--muted)}
table{border-collapse:collapse;width:100%;margin-top:10px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);font-size:.95rem}
th{font-weight:600}
td:last-child,th:last-child{text-align:right}
@media (max-width:520px){.sheet{padding:18px 14px}.st .row{flex-direction:column;gap:8px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
<form id="gate" class="sheet" autocomplete="off">
  <h1>Kiểm tra Chương 1: Dao động</h1>
  <p class="sub">Vật lí 11. Thời gian làm bài: 40 phút.</p>
  <label class="f" for="cls">Lớp</label>
  <input type="text" id="cls" placeholder="Ví dụ: 11A3" required>
  <label class="f" for="nm">Họ và tên</label>
  <input type="text" id="nm" placeholder="Không bắt buộc">
  <p class="err" id="gerr" role="alert"></p>
  <button type="submit">Bắt đầu làm bài</button>
</form>

<form id="exam" hidden novalidate>
  <div class="sheet" id="top"></div>
  <div id="parts"></div>
  <div class="sheet" id="subbar">
    <div id="pal"></div>
    <div class="bar">
      <button type="button" class="alt" id="prev">Câu trước</button>
      <button type="button" class="alt" id="next">Câu sau</button>
      <button type="submit" id="subbtn">Nộp bài</button>
      <p id="cnt" aria-live="polite"></p>
    </div>
  </div>
</form>
</main>

{q:"Đồ thị li độ theo thời gian của một vật dao động điều hoà có dạng",o:["đường thẳng.","đường parabol.","đường hình sin.","đường elip."],a:2,e:"Li độ biến thiên theo hàm cos (hoặc sin) của thời gian nên đồ thị là đường hình sin."},
{q:"Một chất điểm chuyển động tròn đều trên đường tròn bán kính 10 cm với tốc độ góc 4 rad/s. Hình chiếu của chất điểm lên một đường kính dao động điều hoà với biên độ và tần số góc lần lượt là",o:["10 cm; 4 rad/s.","5 cm; 4 rad/s.","10 cm; 8 rad/s.","20 cm; 4 rad/s."],a:0,e:"Biên độ bằng bán kính quỹ đạo (10 cm), tần số góc bằng tốc độ góc (4 rad/s)."},
{q:"Hai dao động điều hoà cùng tần số có độ lệch pha bằng π thì hai dao động đó",o:["cùng pha.","ngược pha.","vuông pha.","lệch pha π/4."],a:1,e:"Độ lệch pha bằng π (hay (2k + 1)π) là hai dao động ngược pha."},

{q:"Gia tốc của vật dao động điều hoà",o:["luôn cùng chiều với vận tốc.","có độ lớn không đổi theo thời gian.","luôn hướng về vị trí cân bằng và có độ lớn tỉ lệ với độ lớn li độ.","luôn hướng ra xa vị trí cân bằng."],a:2,e:"a = −ω²x: luôn hướng về vị trí cân bằng, độ lớn tỉ lệ với |x|."},
{q:"Một vật dao động điều hoà theo phương trình x = 6cos(2πt + π/2) cm. Tại thời điểm t = 0, vật",o:["ở vị trí biên dương.","ở vị trí biên âm.","đi qua vị trí cân bằng theo chiều dương.","đi qua vị trí cân bằng theo chiều âm."],a:3,e:"x(0) = 6cos(π/2) = 0; v = −12π·sin(π/2) < 0 nên vật qua vị trí cân bằng theo chiều âm."},
{q:"Khi vật dao động điều hoà đi qua vị trí cân bằng thì",o:["vận tốc bằng 0, gia tốc có độ lớn cực đại.","vận tốc có độ lớn cực đại, gia tốc bằng 0.","vận tốc và gia tốc đều bằng 0.","vận tốc và gia tốc đều có độ lớn cực đại."],a:1,e:"Tại vị trí cân bằng x = 0 nên |v| cực đại và a = 0."},
{q:"Chu kì dao động của con lắc lò xo phụ thuộc vào",o:["biên độ dao động.","khối lượng của vật nặng và độ cứng của lò xo.","cách kích thích dao động ban đầu.","chiều dài tự nhiên của lò xo."],a:1,e:"T = 2π√(m/k) chỉ phụ thuộc m và k."},
{q:"Một vật dao động điều hoà với tần số góc 5 rad/s. Khi vật có li độ 4 cm thì tốc độ là 15 cm/s. Biên độ dao động của vật là",o:["4 cm.","3 cm.","5 cm.","7 cm."],a:2,e:"A² = x² + v²/ω² = 16 + 9 = 25 nên A = 5 cm."},
{q:"Khi vật dao động điều hoà chuyển động từ vị trí cân bằng ra vị trí biên thì",o:["động năng giảm, thế năng tăng.","động năng tăng, thế năng giảm.","động năng và thế năng cùng tăng.","cơ năng của vật giảm dần."],a:0,e:"|x| tăng, |v| giảm nên động năng giảm, thế năng tăng; cơ năng không đổi."},
{q:"Con lắc lò xo gồm vật nặng khối lượng 0,2 kg và lò xo có độ cứng 20 N/m dao động điều hoà. Chu kì dao động của con lắc là",o:["2π s.","0,2π s.","0,1π s.","0,02π s."],a:1,e:"T = 2π√(m/k) = 2π√(0,2/20) = 0,2π s."},
{q:"Một vật dao động điều hoà với chu kì T. Động năng và thế năng của vật biến thiên tuần hoàn với chu kì",o:["T.","2T.","T/2.","T/4."],a:2,e:"Động năng và thế năng biến thiên với tần số 2f, tức chu kì T/2."},
{q:"Bộ phận giảm xóc của ô tô, xe máy hoạt động dựa trên dao động",o:["duy trì.","tự do.","cộng hưởng.","tắt dần."],a:3,e:"Giảm xóc làm dao động nhanh chóng tắt đi: ứng dụng của dao động tắt dần."},
{q:"Hiện tượng cộng hưởng xảy ra khi tần số của lực cưỡng bức",o:["lớn hơn nhiều tần số dao động riêng của hệ.","nhỏ hơn nhiều tần số dao động riêng của hệ.","bằng tần số dao động riêng của hệ.","bằng không."],a:2,e:"Cộng hưởng xảy ra khi tần số lực cưỡng bức bằng tần số dao động riêng của hệ."},
{q:"Khi vắt, ở một tốc độ quay nhất định máy giặt rung mạnh nhất. Đó là do",o:["dao động tắt dần.","hiện tượng cộng hưởng.","dao động tự do.","lực ma sát của lồng giặt."],a:1,e:"Tần số quay của lồng giặt trùng với tần số riêng của hệ nên xảy ra cộng hưởng."}
];
const P2=[
{img:0,q:"Một vật dao động điều hoà dọc theo trục Ox. Đồ thị li độ x theo thời gian t của vật được cho ở hình dưới đây. Xét tính đúng – sai của các phát biểu sau:",s:[
 {t:"Biên độ dao động của vật là 4 cm.",a:1,e:"Giá trị cực đại của x là 4 cm nên A = 4 cm."},
 {t:"Tần số của dao động là 2 Hz.",a:0,e:"Chu kì T = 2 s nên f = 1/T = 0,5 Hz."},
 {t:"Tại thời điểm t = 0,5 s, vật ở vị trí biên dương.",a:1,e:"Tại t = 0,5 s, x = +4 cm = A."},
 {t:"Tại thời điểm t = 1 s, vật đi qua vị trí cân bằng.",a:1,e:"Tại t = 1 s, x = 0."}]},
{img:1,q:"Một vật dao động điều hoà dọc theo trục Ox. Đồ thị gia tốc a theo li độ x của vật là đoạn thẳng như hình dưới đây. Xét tính đúng – sai của các phát biểu sau:",s:[
 {t:"Biên độ dao động của vật là 5 cm.",a:1,e:"Li độ chạy từ −5 cm đến 5 cm nên A = 5 cm."},
 {t:"Gia tốc của vật luôn cùng dấu với li độ.",a:0,e:"a = −ω²x nên a luôn ngược dấu với x (đồ thị có hệ số góc âm)."},
 {t:"Tần số góc của dao động là 2 rad/s.",a:1,e:"Hệ số góc: ω² = 20/5 = 4 nên ω = 2 rad/s."},
 {t:"Tốc độ cực đại của vật là 20 cm/s.",a:0,e:"v_max = ωA = 2·5 = 10 cm/s."}]},
{img:2,q:"Một vật có khối lượng 200 g dao động điều hoà. Hình dưới đây là đồ thị động năng của vật theo thời gian t. Lấy π² = 10. Xét tính đúng – sai của các phát biểu sau:",s:[
 {t:"Cơ năng của vật là 20 mJ.",a:0,e:"Động năng cực đại là 40 mJ, bằng cơ năng nên W = 40 mJ."},
 {t:"Chu kì dao động của vật là 1 s.",a:1,e:"Động năng biến thiên với chu kì 0,5 s = T/2 nên T = 1 s."},
 {t:"Biên độ dao động của vật là 10 cm.",a:1,e:"ω = 2π rad/s; W = ½mω²A² nên 0,04 = ½·0,2·40·A², A = 0,1 m = 10 cm."},
 {t:"Tốc độ cực đại của vật là 20π cm/s.",a:1,e:"v_max = ωA = 2π·10 = 20π cm/s."}]}
];
const P3=[
{q:"Hình dưới đây là đồ thị vận tốc v theo thời gian t của một vật dao động điều hoà. Biên độ dao động của vật là bao nhiêu cm?",img:3,a:12,u:"cm",e:"Từ đồ thị, v = 0 tại t = 0,2 s và t = 0,6 s nên T/2 = 0,4 s, T = 0,8 s, ω = 2π/T = 2,5π rad/s. Vì v_max = 30π cm/s nên A = v_max/ω = 12 cm."},
{q:"Một vật khối lượng 150 g dao động điều hoà. Hình dưới đây là đồ thị thế năng Wt theo li độ x của vật. Khi vật có li độ 3 cm thì tốc độ của vật là bao nhiêu cm/s?",img:4,a:60,u:"cm/s",e:"Tại x = ±6 cm thế năng cực đại 36 mJ nên A = 6 cm và W = 36 mJ. Tại x = 3 cm: Wt = 36·(3/6)² = 9 mJ nên Wđ = 27 mJ. Từ ½mv² = 0,027 J suy ra v² = 2·0,027/0,15 = 0,36, v = 0,6 m/s = 60 cm/s."},
{q:"Một vật dao động điều hoà với biên độ 8 cm và tần số góc 10 rad/s. Tại vị trí mà thế năng của vật bằng 3 lần động năng, tốc độ của vật là bao nhiêu cm/s?",a:40,u:"cm/s",e:"W = Wt + Wđ = 4Wđ nên Wđ = W/4, suy ra v = v_max/2 = ωA/2 = 10·8/2 = 40 cm/s."},
{q:"Một vật khối lượng 200 g dao động điều hoà với tần số góc 10 rad/s. Khi vật có li độ 6 cm thì động năng của vật là 64 mJ. Biên độ dao động của vật là bao nhiêu cm?",a:10,u:"cm",e:"Từ Wđ = ½mv² suy ra v² = 2·0,064/0,2 = 0,64 nên v = 0,8 m/s = 80 cm/s; A² = x² + (v/ω)² = 36 + 64 = 100 nên A = 10 cm."},
{q:"Hình dưới đây là đồ thị li độ x theo thời gian t của một vật dao động điều hoà. Lấy π² = 10. Độ lớn gia tốc cực đại của vật là bao nhiêu cm/s²?",img:5,a:2000,u:"cm/s²",e:"Từ đồ thị, A = 8 cm. Li độ cực đại tại t = 0,05 s và cực tiểu tại t = 0,25 s nên T/2 = 0,2 s, T = 0,4 s, ω = 2π/T = 5π rad/s. a_max = ω²A = 25π²·8 = 25·10·8 = 2000 cm/s²."}
];
const TOTAL=15+12+5;
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>(Math.round(n*100)/100).toLocaleString("vi-VN",{maximumFractionDigits:2});
let S,who={},warned=false,locked=false,cur=0,QS=[],R=[];

function build(){
  S={p1:shuffle(P1.map((_,i)=>i)).map(i=>({i,o:shuffle([0,1,2,3])})),
     p2:shuffle([0,1,2]).map(i=>({i,t:shuffle([0,1,2,3])})),
     p3:shuffle([0,1,2,3,4])};
  warned=false;locked=false;
  const e=x=>x.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  $("#top").innerHTML=`<h1>Kiểm tra Chương 1: Dao động</h1><p class="sub">Vật lí 11. Thời gian làm bài: 40 phút.</p><div class="who"><span>Họ và tên: <b>${e(who.name||"…………")}</b></span><span>Lớp: <b>${e(who.cls)}</b></span></div><div id="sum"></div>`;
  let h=`<section class="sheet"><h2>Phần I. Trắc nghiệm nhiều lựa chọn</h2><p class="sub">15 câu, 4,5 điểm</p><p class="hint">Mỗi câu chỉ chọn một phương án.</p>`;
  S.p1.forEach((b,n)=>{const q=P1[b.i];
    h+=`<div class="q" id="a1-${n}"><p class="qh"><span class="qn">Câu ${n+1}.</span> ${q.q}</p>`+
    b.o.map((oi,k)=>`<label class="opt" data-o="${oi}"><input type="radio" name="a1_${n}" value="${oi}"><span class="l">${"ABCD"[k]}.</span><span class="t">${q.o[oi]}</span><span class="tag"></span></label>`).join("")+`<div class="why" hidden></div></div>`});
  h+=`</section><section class="sheet"><h2>Phần II. Trắc nghiệm đúng – sai</h2><p class="sub">3 câu, 3,0 điểm</p><p class="hint">Với mỗi ý a), b), c), d), chọn Đúng hoặc Sai.</p>`;
  S.p2.forEach((b,n)=>{const q=P2[b.i];
    h+=`<div class="q" id="a2-${n}"><p class="qh"><span class="qn">Câu ${n+1}.</span> ${q.q}</p><figure><img src="${IMG[q.img]}" alt="Đồ thị của câu ${n+1}"></figure>`+
    b.t.map((ti,k)=>`<div class="st" data-t="${ti}"><div class="row"><div><span class="l">${"abcd"[k]})</span>${q.s[ti].t}</div><div class="tf"><label class="pill"><input type="radio" name="a2_${n}_${k}" value="1"><span>Đúng</span></label><label class="pill"><input type="radio" name="a2_${n}_${k}" value="0"><span>Sai</span></label></div></div><div class="why" hidden></div></div>`).join("")+`<div class="qs" hidden></div></div>`});
  h+=`</section><section class="sheet"><h2>Phần III. Trắc nghiệm trả lời ngắn</h2><p class="sub">5 câu, 2,5 điểm</p><p class="hint">Ghi đáp số, không cần trình bày lời giải. Có thể dùng dấu phẩy hoặc dấu chấm thập phân.</p>`;
  S.p3.forEach((qi,n)=>{const q=P3[qi];
    h+=`<div class="q" id="a3-${n}"><p class="qh"><span class="qn">Câu ${n+1}.</span> ${q.q}</p>${q.img!=null?`<figure><img src="${IMG[q.img]}" alt="Đồ thị của câu ${n+1}"></figure>`:""}<div class="ans"><label for="i3_${n}">Đáp số:</label><input type="text" id="i3_${n}" inputmode="decimal" autocomplete="off"><span class="unit">${q.u}</span></div><div class="why" hidden></div></div>`});
  h+=`</section>`;
  $("#parts").innerHTML=h;
  $("#parts").classList.remove("locked");
  $("#subbar").hidden=false;$("#subbtn").hidden=false;$("#cnt").hidden=false;{const m=$("#msg");if(m)m.remove()}
  QS=[...document.querySelectorAll("#parts .q")];R=[];mkPal();show(0);
  upd();
}

function answered(){
  let c=0;
  S.p1.forEach((_,n)=>{if($(`input[name=a1_${n}]:checked`))c++});
  S.p2.forEach((_,n)=>{for(let k=0;k<4;k++)if($(`input[name=a2_${n}_${k}]:checked`))c++});
  S.p3.forEach((_,n)=>{if($(`#i3_${n}`).value.trim())c++});
  return c;
}
function upd(){$("#cnt").textContent=`Đã trả lời ${answered()}/${TOTAL} mục`;updPal()}

function mark(el,ok,txt,cls){el.hidden=false;el.className="why "+(ok?"ok":cls||"bad");el.innerHTML=txt}

function stOf(i){
  if(locked)return R[i]||"none";
  const q=QS[i];
  if(i<15)return q.querySelector("input:checked")?"done":"";
  if(i<18){const n=q.querySelectorAll("input:checked").length;return n===4?"done":n?"part":""}
  return q.querySelector("input[type=text]").value.trim()?"done":"";
}
function mkPal(){
  const g=[["Phần I",0,15],["Phần II",15,3],["Phần III",18,5]];
  $("#pal").innerHTML=g.map(([l,s,c])=>`<div class="pg"><span class="pl">${l}</span><span class="pb">${Array.from({length:c},(_,k)=>`<button type="button" class="pn" data-i="${s+k}" aria-label="${l}, câu ${k+1}">${k+1}</button>`).join("")}</span></div>`).join("");
}
function updPal(){
  document.querySelectorAll("#pal .pn").forEach(b=>{const i=+b.dataset.i;b.className="pn "+stOf(i)+(i===cur?" cur":"");if(i===cur)b.setAttribute("aria-current","true");else b.removeAttribute("aria-current")});
}
function show(i){
  cur=i;QS.forEach((q,j)=>q.hidden=j!==i);
  document.querySelectorAll("#parts .sheet").forEach(s=>s.hidden=!s.querySelector(".q:not([hidden])"));
  $("#prev").disabled=i===0;$("#next").disabled=i===QS.length-1;updPal();
}
function go(i){show(i);$("#parts").scrollIntoView()}

function grade(){
  locked=true;
  let c1=0,s2=0,c3=0,full2=0;
  S.p1.forEach((b,n)=>{
    const q=P1[b.i],box=$("#a1-"+n),ch=box.querySelector("input:checked"),pick=ch?+ch.value:-1,ok=pick===q.a;
    if(ok)c1++;R[n]=ok?"ok":ch?"bad":"none";
    box.querySelectorAll(".opt").forEach(l=>{const o=+l.dataset.o,t=l.querySelector(".tag");
      if(o===q.a){l.classList.add("ok");t.textContent="✓ Đáp án đúng"}
      else if(o===pick){l.classList.add("bad");t.textContent="✗ Bạn chọn"}});
    mark(box.querySelector(".why"),ok,`<b>${ok?"✓ Chính xác.":ch?"✗ Chưa đúng.":"Chưa trả lời."}</b> Đáp án: ${"ABCD"[b.o.indexOf(q.a)]}. ${q.e}`);
  });
  S.p2.forEach((b,n)=>{
    const q=P2[b.i],box=$("#a2-"+n);let cc=0;
    box.querySelectorAll(".st").forEach((st,k)=>{
      const it=q.s[+st.dataset.t],ch=st.querySelector("input:checked"),ok=!!ch&&(+ch.value===1)===!!it.a;
      if(ok)cc++;
      st.querySelectorAll(".pill").forEach(p=>{const v=+p.querySelector("input").value;
        if(v===it.a)p.classList.add("ok");else if(ch&&+ch.value===v)p.classList.add("bad")});
      mark(st.querySelector(".why"),ok,`<b>${ok?"✓":ch?"✗":"–"} Đáp án: ${it.a?"Đúng":"Sai"}.</b> ${it.e}`);
    });
    const p=[0,0.1,0.25,0.5,1][cc];s2+=p;if(cc===4)full2++;R[15+n]=cc===4?"ok":box.querySelector("input:checked")?(cc===0?"bad":"mid"):"none";
    const qs=box.querySelector(".qs");qs.hidden=false;qs.textContent=`Câu ${n+1}: đúng ${cc}/4 ý, được ${fmt(p)} điểm.`;
  });
  S.p3.forEach((qi,n)=>{
    const q=P3[qi],box=$("#a3-"+n),raw=$(`#i3_${n}`).value.trim(),v=parseFloat(raw.replace(",",".")),ok=!isNaN(v)&&Math.abs(v-q.a)<=Math.max(0.005,Math.abs(q.a)*0.005);
    if(ok)c3++;R[18+n]=ok?"ok":raw?"bad":"none";
    mark(box.querySelector(".why"),ok,`<b>${ok?"✓ Chính xác.":raw?"✗ Chưa đúng.":"Chưa trả lời."}</b> Đáp số: ${fmt(q.a)} ${q.u}. ${q.e}`);
  });
  document.querySelectorAll("#exam input").forEach(i=>i.disabled=true);
  $("#parts").classList.add("locked");
  const s1=c1*0.3,s3=c3*0.5,tot=Math.round((s1+s2+s3)*100)/100;
  $("#sum").innerHTML=`<div class="score"><span class="n">${fmt(tot)}</span><span class="d">/ 10 điểm</span></div>
  <table><tr><th>Phần</th><th>Kết quả</th><th>Điểm</th></tr>
  <tr><td>I. Nhiều lựa chọn</td><td>${c1}/15 câu đúng</td><td>${fmt(s1)}/4,5</td></tr>
  <tr><td>II. Đúng – sai</td><td>${full2}/3 câu đúng cả 4 ý</td><td>${fmt(s2)}/3</td></tr>
  <tr><td>III. Trả lời ngắn</td><td>${c3}/5 câu đúng</td><td>${fmt(s3)}/2,5</td></tr></table>
  <p class="sub" style="margin-top:12px">Đáp án và hướng dẫn giải nằm ngay dưới mỗi câu.</p>
  <button type="button" class="alt" id="again">Làm lại với đề đảo mới</button>`;
  $("#again").onclick=()=>{build();window.scrollTo(0,0)};
  $("#subbtn").hidden=true;$("#cnt").hidden=true;{const m=$("#msg");if(m)m.remove()}show(0);
  window.scrollTo(0,0);
}

$("#pal").addEventListener("click",ev=>{const b=ev.target.closest(".pn");if(b)go(+b.dataset.i)});
$("#prev").onclick=()=>go(cur-1);
$("#next").onclick=()=>go(cur+1);
$("#exam").addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.type==="text"){ev.preventDefault();if(cur<QS.length-1)go(cur+1)}});
$("#gate").addEventListener("submit",ev=>{
  ev.preventDefault();
  const cls=$("#cls").value.trim();
  if(!cls){$("#gerr").textContent="Hãy nhập lớp của bạn trước khi bắt đầu.";$("#cls").focus();return}
  who={cls,name:$("#nm").value.trim()};
  $("#gate").hidden=true;$("#exam").hidden=false;
  build();window.scrollTo(0,0);
});
$("#exam").addEventListener("input",()=>{if(!locked){warned=false;upd();const m=$("#msg");if(m)m.remove()}});
$("#exam").addEventListener("submit",ev=>{
  ev.preventDefault();
  if(locked)return;
  const left=TOTAL-answered();
  if(left>0&&!warned){
    warned=true;
    let m=$("#msg");if(!m){m=document.createElement("p");m.id="msg";m.className="err";m.setAttribute("role","alert");$("#subbar").appendChild(m)}
    m.textContent=`Còn ${left} mục chưa trả lời. Nhấn “Nộp bài” lần nữa để nộp.`;
    return;
  }
  grade();
});
</script>
</body>
</html>
